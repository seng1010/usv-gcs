<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>My Little Ecoboat - Web Edition</title>
    <!-- ROSLIB.js 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/roslibjs/1.1.0/roslib.min.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: '맑은 고딕', sans-serif;
            overflow: hidden;
        }
        /* 게임 컨테이너를 상대 위치로 설정하여 카메라 패널을 겹칠 수 있게 함 */
        #gameContainer {
            position: relative;
            display: inline-block;
        }
        canvas {
            border: 3px solid #e29578;
            background-color: #2c1a11;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        /* 📷 카메라 스트리밍 패널 (우측 하단 상점 아래 영역) */
        #cameraPanel {
            position: absolute;
            top: 440px;
            left: 585px;
            width: 200px;
            height: 120px;
            background-color: #1c100a;
            border: 2px solid #38bdf8;
            box-sizing: border-box;
            padding: 3px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }
        .cam-box {
            width: 100%;
            height: 54px;
            background-color: #000;
            border: 1px solid #38bdf8;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cam-title {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 8px;
            color: #38bdf8;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 1px 3px;
            border-radius: 2px;
            z-index: 2;
        }
        .cam-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- 우측 하단 카메라 패널 -->
        <div id="cameraPanel">
            <div class="cam-box">
                <span class="cam-title">📷 수면 (Surface)</span>
                <img id="surfaceCam" src="http://localhost:8080/stream?topic=/camera/surface/image_raw" alt="수면 카메라 연결 중..." />
            </div>
            <div class="cam-box">
                <span class="cam-title">🌊 수중 (Underwater)</span>
                <img id="underwaterCam" src="http://localhost:8080/stream?topic=/camera/underwater/image_raw" alt="수중 카메라 연결 중..." />
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
